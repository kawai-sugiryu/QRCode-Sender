<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>QR File Sender (Web版)</title>
<style>
  html, body {
    height: 100%;
  }
  body {
    font-family: sans-serif;
    background: #f0f0f0;
    color: #222;
    margin: 0;
    padding: 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  h2 { margin-top: 0; }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  label { font-size: 14px; }
  input[type="number"] {
    width: 80px;
    padding: 4px;
    background: #fff;
    color: #222;
    border: 1px solid #aaa;
    border-radius: 3px;
  }
  button {
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    background: #e1e1e1;
    color: #222;
    border: 1px solid #999;
    border-radius: 3px;
  }
  button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }
  #dropZone {
    border: 2px dashed #999;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    margin-bottom: 10px;
    background: #fafafa;
  }
  #dropZone.dragover {
    border-color: #4caf50;
    background: #eaf7ea;
  }
  #status {
    white-space: pre-wrap;
    font-family: monospace;
    background: #fff;
    color: #222;
    border: 1px solid #ccc;
    padding: 8px;
    margin-bottom: 10px;
    min-height: 20px;
  }
  #trackBarLabel { font-size: 13px; color: #555; margin-bottom: 4px; }
  #frameSlider { width: 100%; }

  /*
    表示領域の外側ラッパー。この中でJSが #qrContainer のwidth/heightを
    px指定で明示的に制御する(aspect-ratioやmax-widthに頼らない)。
    残り高さを最大限使うため flex:1 で伸縮させる。

    背景を白にしているのは、QRコード自体の生成は正しくても、
    暗い背景(ページ全体のダークテーマ)がQRコードの外周に近すぎると、
    カメラでの二値化・ファインダーパターン検出に悪影響が出て
    読み取りに失敗するケースがあったための対策。
    QRコード規格上のクワイエットゾーン(周囲の白余白)は canvas 内部にも
    別途確保しているが、それに加えてページ全体としても白い領域を
    広めに確保している。
  */
  #qrOuter {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    background: white;
    border-radius: 4px;
    padding: 12px;
    box-sizing: border-box;
  }

  /*
    実際にQRコードを並べるコンテナ。1枚モードでは中央寄せの単一領域、
    2枚モードでは表示領域を中央で2分割し、それぞれの区画の中央にQRを
    配置する(区画そのものが「表示領域の半分」になるため、QR同士の間隔は
    区画の境界で自然に生まれる。間隔の大きさは各区画内のQRサイズを
    やや小さめにすることで調整する)。
    flex-direction(row/column)はJSが実測サイズに応じて切り替える。
  */
  #qrContainer {
    display: flex;
    width: 100%;
    height: 100%;
    background: white;
    box-sizing: border-box;
  }
  .qrSlot {
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    box-sizing: border-box;
  }
  .qrSlot canvas {
    image-rendering: pixelated;
  }
  #qrSlot2.hidden {
    display: none;
  }

  /*
    スマホ(縦長・幅の狭い画面)向けの最適化。
    PC表示と同じ構成(上に操作UI、下に残り全部をQR表示領域)を維持しつつ、
    操作UI側を詰めてQR表示領域により多くの高さを割り当てる。
  */
  @media (max-width: 600px) {
    body {
      padding: 8px;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }
    #dropZone {
      padding: 10px;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .row {
      gap: 6px;
      margin-bottom: 6px;
    }
    label {
      font-size: 12px;
    }
    input[type="number"] {
      width: 64px;
      padding: 3px;
    }
    button {
      padding: 6px 12px;
      font-size: 13px;
    }
    #dualModeLabelText {
      font-size: 12px;
    }
    #trackBarLabel {
      font-size: 11px;
      margin-bottom: 2px;
    }
    #status {
      font-size: 12px;
      padding: 6px;
      margin-bottom: 6px;
      min-height: 0;
    }
  }
</style>
</head>
<body>

<h2>QR File Sender (Web版)</h2>

<div id="dropZone">
  ここにファイルをドラッグ&ドロップ、またはボタンでファイルを選択してください
  <div class="row" style="justify-content:center; margin-top:8px;">
    <input type="file" id="fileInput">
  </div>
</div>

<div class="row">
  <label for="intervalInput">切替間隔(ms):</label>
  <input type="number" id="intervalInput" value="300" min="200" max="10000" step="100">

  <label for="chunkSizeInput">1枚あたりバイト数:</label>
  <input type="number" id="chunkSizeInput" value="100" min="16" max="1000" step="10">

  <button id="startStopButton" disabled>送信開始</button>
</div>

<div class="row">
  <label>
    <input type="checkbox" id="dualModeCheckbox">
    <span id="dualModeLabelText">2枚同時表示(1回の切替で2フレーム進みます。表示領域の縦横比に応じて自動で縦並び/横並びになります)</span>
  </label>
</div>

<div id="trackBarLabel">表示フレーム: - / -(スライダーで任意のフレームへジャンプできます)</div>
<input type="range" id="frameSlider" min="0" max="0" value="0" disabled>

<div id="status">ファイルを選択してください。</div>

<div id="qrOuter">
  <div id="qrContainer">
    <div class="qrSlot" id="qrSlot1"><canvas id="qrCanvas1"></canvas></div>
    <div class="qrSlot hidden" id="qrSlot2"><canvas id="qrCanvas2"></canvas></div>
  </div>
</div>

<!--
  qrcode-generator (MITライセンス, https://github.com/kazuhikoarase/qrcode-generator)
  を、このHTMLと同じ場所に qrcode.js として配置してください。
-->
<script src="qrcode.js"></script>
<script>
'use strict';

// ============================================================
// フレームフォーマット(C#版 QrFileSender と共通仕様)
//
//   先頭フレーム(FrameIndex=0):
//     Magic(1) + TotalFrames(2) + FrameIndex(2) + FileNameLen(1) + FileName(UTF8, 可変長)
//     + ChunkLen(2) + ChunkData(可変長)
//   後続フレーム:
//     Magic(1) + TotalFrames(2) + FrameIndex(2) + ChunkLen(2) + ChunkData(可変長)
//
//   Magic = 0xB7
//   TotalFrames, FrameIndex, ChunkLen はすべてビッグエンディアン16bit
//   QRコード自体がリード・ソロモン誤り訂正を内蔵しているため、追加のCRC等は付与しない。
//
//   2枚同時表示は、あくまで「1回の切替で2フレーム分を並べて見せる」表示上の機能であり、
//   フレーム自体のフォーマットや意味は1枚モードと同じ(受信側の変更は不要)。
// ============================================================

const MAGIC = 0xB7;

/**
 * ファイルのバイナリデータとファイル名から、QRコードに格納するフレーム
 * (Uint8Arrayの配列)を生成する。
 */
function buildFrames(fileBytes, fileName, chunkCapacity) {
  const fileNameBytes = new TextEncoder().encode(fileName);
  if (fileNameBytes.length > 255) {
    throw new Error('ファイル名が長すぎます(UTF8で255バイト以内にしてください)。');
  }

  const headerSizeFirstFrameFixed = 8; // Magic+TotalFrames+FrameIndex+FileNameLen+ChunkLen
  const headerSizeRestFrame = 7;       // Magic+TotalFrames+FrameIndex+ChunkLen

  const firstFrameMaxChunk = chunkCapacity - headerSizeFirstFrameFixed - fileNameBytes.length;
  const restFrameMaxChunk = chunkCapacity - headerSizeRestFrame;

  if (firstFrameMaxChunk <= 0) {
    throw new Error('ファイル名が長すぎて、先頭フレームにデータを格納できません。');
  }
  if (restFrameMaxChunk <= 0) {
    throw new Error('1枚あたりバイト数が小さすぎます。');
  }

  const chunks = [];
  let offset = 0;
  const firstChunkLen = Math.min(firstFrameMaxChunk, fileBytes.length);
  chunks.push(fileBytes.slice(offset, offset + firstChunkLen));
  offset += firstChunkLen;

  while (offset < fileBytes.length) {
    const len = Math.min(restFrameMaxChunk, fileBytes.length - offset);
    chunks.push(fileBytes.slice(offset, offset + len));
    offset += len;
  }

  if (chunks.length === 0) {
    chunks.push(new Uint8Array(0)); // 0バイトファイルでも1フレームは送る
  }

  const totalFrames = chunks.length;
  const frames = [];

  for (let i = 0; i < totalFrames; i++) {
    const chunk = chunks[i];
    const parts = [];

    parts.push(MAGIC);
    pushUInt16(parts, totalFrames);
    pushUInt16(parts, i);

    if (i === 0) {
      parts.push(fileNameBytes.length);
      for (let j = 0; j < fileNameBytes.length; j++) {
        parts.push(fileNameBytes[j]);
      }
    }

    pushUInt16(parts, chunk.length);
    for (let j = 0; j < chunk.length; j++) {
      parts.push(chunk[j]);
    }

    frames.push(new Uint8Array(parts));
  }

  return frames;
}

function pushUInt16(arr, value) {
  arr.push((value >> 8) & 0xff);
  arr.push(value & 0xff);
}

// ============================================================
// qrcode-generator のバイナリ対応
// stringToBytes を上書きし、文字列の各文字コード(0-255)をそのまま
// バイト値として扱う(Latin1的な1バイト1文字の対応にする)。
// ============================================================
qrcode.stringToBytes = function (s) {
  const bytes = [];
  for (let i = 0; i < s.length; i++) {
    bytes.push(s.charCodeAt(i) & 0xff);
  }
  return bytes;
};

function bytesToBinaryString(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i++) {
    s += String.fromCharCode(bytes[i]);
  }
  return s;
}

// ============================================================
// UI制御
// ============================================================

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const intervalInput = document.getElementById('intervalInput');
const chunkSizeInput = document.getElementById('chunkSizeInput');
const startStopButton = document.getElementById('startStopButton');
const dualModeCheckbox = document.getElementById('dualModeCheckbox');
const statusEl = document.getElementById('status');
const trackBarLabel = document.getElementById('trackBarLabel');
const frameSlider = document.getElementById('frameSlider');
const qrOuter = document.getElementById('qrOuter');
const qrContainer = document.getElementById('qrContainer');
const qrSlot2 = document.getElementById('qrSlot2');
const qrCanvas1 = document.getElementById('qrCanvas1');
const qrCanvas2 = document.getElementById('qrCanvas2');

let loadedFileBytes = null;
let loadedFileName = null;
let loadNotice = '';
let frames = null;
let currentIndex = 0; // 常に「表示中の先頭フレーム番号」を指す(2枚モードでは相方は currentIndex+1)
let running = false;
let timerId = null;
let suppressSliderEvent = false;

function log(msg) {
  statusEl.textContent = msg;
}

fileInput.addEventListener('change', () => {
  if (fileInput.files && fileInput.files.length > 0) {
    loadFile(fileInput.files[0]);
  }
});

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
    loadFile(e.dataTransfer.files[0]);
  }
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      let bytes = new Uint8Array(reader.result);
      let name = file.name;
      loadNotice = '';

      // 拡張子が .zip でなければ、ZIPに圧縮してから送信する
      if (!/\.zip$/i.test(name)) {
        const originalSize = bytes.length;
        bytes = await createZip(name, bytes, file.lastModified);
        name = name + '.zip';
        loadNotice = 'ZIP圧縮: ' + originalSize + ' → ' + bytes.length + ' バイト / ';
      }

      loadedFileBytes = bytes;
      loadedFileName = name;

      // 最終フレームが最も大きくなる1枚あたりバイト数を自動設定する
      const best = findBestChunkCapacity(bytes.length, new TextEncoder().encode(name).length);
      chunkSizeInput.value = String(best);

      rebuildFrames();
      startStopButton.disabled = false;
    } catch (e) {
      alert('ファイルの処理に失敗しました: ' + e.message);
    }
  };
  reader.onerror = () => {
    alert('ファイルの読み込みに失敗しました: ' + reader.error);
  };
  reader.readAsArrayBuffer(file);
}

// ============================================================
// 1枚あたりバイト数の自動設定
// 範囲内の各値でフレーム分割を試算し、最終フレームのデータ量が最大になる値を選ぶ。
// 最終フレームだけデータが極端に少ないと、QRのマーカー比率が大きくなり
// 読み取り品質が下がるための対策。同点の場合は大きい値(=総フレーム数が少ない方)を優先する。
// ============================================================
const AUTO_CAPACITY_MIN = 156;
const AUTO_CAPACITY_MAX = 216;

function findBestChunkCapacity(dataLength, fileNameLength) {
  let bestCap = AUTO_CAPACITY_MAX;
  let bestLast = -1;
  for (let cap = AUTO_CAPACITY_MAX; cap >= AUTO_CAPACITY_MIN; cap--) {
    const firstMax = cap - 8 - fileNameLength;
    const restMax = cap - 7;
    if (firstMax <= 0) {
      continue;
    }
    let lastLen;
    if (dataLength <= firstMax) {
      lastLen = dataLength; // 1フレームのみ
    } else {
      const remain = dataLength - firstMax;
      lastLen = remain % restMax;
      if (lastLen === 0) {
        lastLen = restMax;
      }
    }
    if (lastLen > bestLast) { // 大きい値から走査しているので、同点なら大きい値が残る
      bestLast = lastLen;
      bestCap = cap;
    }
  }
  return bestCap;
}

// ============================================================
// ZIP作成(単一ファイル)
// deflate-raw圧縮(CompressionStream対応ブラウザ)を試み、非対応または
// 圧縮しても小さくならない場合は無圧縮(stored)で格納する。
// ============================================================
const crcTable = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

async function deflateRaw(bytes) {
  if (typeof CompressionStream === 'undefined') {
    return null;
  }
  try {
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  } catch (e) {
    return null;
  }
}

async function createZip(entryName, data, lastModified) {
  const nameBytes = new TextEncoder().encode(entryName);
  const crc = crc32(data);

  let method = 0;
  let body = data;
  const deflated = await deflateRaw(data);
  if (deflated !== null && deflated.length < data.length) {
    method = 8;
    body = deflated;
  }

  const d = new Date(lastModified || Date.now());
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = (Math.max(0, d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

  const localSize = 30 + nameBytes.length;
  const centralSize = 46 + nameBytes.length;
  const total = localSize + body.length + centralSize + 22;
  const out = new Uint8Array(total);
  const v = new DataView(out.buffer);
  let p = 0;

  // ローカルファイルヘッダ
  v.setUint32(p, 0x04034b50, true); p += 4;
  v.setUint16(p, 20, true); p += 2;
  v.setUint16(p, 0x0800, true); p += 2; // UTF-8ファイル名
  v.setUint16(p, method, true); p += 2;
  v.setUint16(p, dosTime, true); p += 2;
  v.setUint16(p, dosDate, true); p += 2;
  v.setUint32(p, crc, true); p += 4;
  v.setUint32(p, body.length, true); p += 4;
  v.setUint32(p, data.length, true); p += 4;
  v.setUint16(p, nameBytes.length, true); p += 2;
  v.setUint16(p, 0, true); p += 2;
  out.set(nameBytes, p); p += nameBytes.length;
  out.set(body, p); p += body.length;

  // セントラルディレクトリ
  const centralOffset = p;
  v.setUint32(p, 0x02014b50, true); p += 4;
  v.setUint16(p, 20, true); p += 2;
  v.setUint16(p, 20, true); p += 2;
  v.setUint16(p, 0x0800, true); p += 2;
  v.setUint16(p, method, true); p += 2;
  v.setUint16(p, dosTime, true); p += 2;
  v.setUint16(p, dosDate, true); p += 2;
  v.setUint32(p, crc, true); p += 4;
  v.setUint32(p, body.length, true); p += 4;
  v.setUint32(p, data.length, true); p += 4;
  v.setUint16(p, nameBytes.length, true); p += 2;
  v.setUint16(p, 0, true); p += 2; // extra
  v.setUint16(p, 0, true); p += 2; // comment
  v.setUint16(p, 0, true); p += 2; // disk
  v.setUint16(p, 0, true); p += 2; // internal attr
  v.setUint32(p, 0, true); p += 4; // external attr
  v.setUint32(p, 0, true); p += 4; // local header offset
  out.set(nameBytes, p); p += nameBytes.length;

  // End of central directory
  v.setUint32(p, 0x06054b50, true); p += 4;
  v.setUint16(p, 0, true); p += 2;
  v.setUint16(p, 0, true); p += 2;
  v.setUint16(p, 1, true); p += 2;
  v.setUint16(p, 1, true); p += 2;
  v.setUint32(p, centralSize, true); p += 4;
  v.setUint32(p, centralOffset, true); p += 4;
  v.setUint16(p, 0, true); p += 2;

  return out;
}

chunkSizeInput.addEventListener('change', () => {
  if (loadedFileBytes !== null) {
    rebuildFrames();
  }
});

dualModeCheckbox.addEventListener('change', () => {
  applyLayoutMode();
  if (frames && frames.length > 0) {
    showFrame(currentIndex, false);
  }
});

function rebuildFrames() {
  if (loadedFileBytes === null || loadedFileName === null) {
    return;
  }
  try {
    const chunkCapacity = parseInt(chunkSizeInput.value, 10);
    frames = buildFrames(loadedFileBytes, loadedFileName, chunkCapacity);
    currentIndex = 0;

    if (running) {
      stopSending();
    }

    log(loadNotice + '読み込み完了: ' + loadedFileBytes.length + ' バイト / ' + frames.length +
        ' フレームに分割しました。(1枚あたり最大約' + chunkCapacity + 'バイト)');

    frameSlider.disabled = frames.length <= 1;
    frameSlider.min = 0;
    frameSlider.max = Math.max(0, frames.length - 1);

    applyLayoutMode();
    showFrame(0, true);
  } catch (e) {
    alert('フレーム分割に失敗しました: ' + e.message);
  }
}

startStopButton.addEventListener('click', () => {
  if (!frames || frames.length === 0) {
    return;
  }
  if (running) {
    stopSending();
  } else {
    startSending();
  }
});

function getStep() {
  // 2枚同時表示の場合、1回の切替で2フレーム進む
  return dualModeCheckbox.checked ? 2 : 1;
}

function startSending() {
  const interval = parseInt(intervalInput.value, 10);
  timerId = setInterval(() => {
    const step = getStep();
    currentIndex = (currentIndex + step) % frames.length;
    showFrame(currentIndex, true);
  }, interval);
  running = true;
  startStopButton.textContent = '送信停止';
  fileInput.disabled = true;
  chunkSizeInput.disabled = true;
}

function stopSending() {
  if (timerId !== null) {
    clearInterval(timerId);
    timerId = null;
  }
  running = false;
  startStopButton.textContent = '送信開始';
  fileInput.disabled = false;
  chunkSizeInput.disabled = false;
}

frameSlider.addEventListener('input', () => {
  if (suppressSliderEvent) {
    return;
  }
  if (!frames || frames.length === 0) {
    return;
  }
  if (running) {
    stopSending();
  }
  currentIndex = parseInt(frameSlider.value, 10);
  showFrame(currentIndex, false);
});

// 左右キーで現在フレームから前後に1フレームずつ移動する(左=index-1、右=index+1)。
// 送信中でも動作し、移動後のフレームから自動送信が続く(端はループする)。
// 数値入力欄・ファイル選択欄にフォーカスがある間は、それらの本来の操作を優先する。
// スライダーにフォーカスがある場合は、標準の矢印キー動作との二重移動を避けるため
// 標準動作を打ち消して、こちらの処理だけを行う。
document.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') {
    return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) {
    return;
  }
  const target = e.target;
  if (target && target.tagName === 'INPUT' && target.type !== 'range' && target.type !== 'checkbox') {
    return;
  }
  if (!frames || frames.length === 0) {
    return;
  }

  e.preventDefault();
  const delta = e.key === 'ArrowRight' ? 1 : -1;
  currentIndex = (currentIndex + delta + frames.length) % frames.length;
  showFrame(currentIndex, true);
});

/**
 * 表示領域(#qrOuter の実測サイズ)を基準に、各QRコードのcanvasサイズをpxで
 * 明示的に計算・設定する。aspect-ratioやmax-widthに頼らないため、
 * モバイルでアドレスバーの表示/非表示によって使える高さが変動しても、
 * その時点の実測値に追従できる。
 *
 * 1枚モード: #qrContainer全体を1区画として使い、その中央に正方形のQRを表示。
 * 2枚モード: #qrContainer を中央で2分割(縦長なら上下、横長なら左右)し、
 *            それぞれの区画の中央に正方形のQRを表示する。
 *            QR同士の間隔は、各区画のサイズに対してQRのサイズを
 *            ややに小さく(paddingRatio分)することで区画の境界に余白として生まれる。
 */
function applyLayoutMode() {
  const outerRect = qrOuter.getBoundingClientRect();
  const outerPadding = 12 * 2; // #qrOuter の左右(または上下)合計パディング(CSSのpadding値と合わせること)
  const availableWidth = Math.max(0, outerRect.width - outerPadding);
  const availableHeight = Math.max(0, outerRect.height - outerPadding);

  const paddingRatio = 0.06; // 各区画のサイズに対するQRの余白比率(6%)

  if (!dualModeCheckbox.checked) {
    qrSlot2.classList.add('hidden');
    qrContainer.style.flexDirection = 'row';

    const side = Math.min(availableWidth, availableHeight);
    setCanvasBoxSize(qrCanvas1, side);
    return;
  }

  qrSlot2.classList.remove('hidden');

  // 表示領域が横長なら左右2分割、縦長(またはスマホ)なら上下2分割にする
  const isWide = availableWidth >= availableHeight;

  let slotWidth, slotHeight;
  if (isWide) {
    qrContainer.style.flexDirection = 'row';
    slotWidth = availableWidth / 2;
    slotHeight = availableHeight;
  } else {
    qrContainer.style.flexDirection = 'column';
    slotWidth = availableWidth;
    slotHeight = availableHeight / 2;
  }

  // 各区画に収まる最大の正方形のうち、余白比率分を差し引いたサイズをQRの一辺にする
  const slotSide = Math.min(slotWidth, slotHeight);
  const qrSide = Math.floor(slotSide * (1 - paddingRatio));

  setCanvasBoxSize(qrCanvas1, qrSide);
  setCanvasBoxSize(qrCanvas2, qrSide);
}

/** canvasのCSS表示サイズ(見た目のpx)を正方形で明示的に指定する */
function setCanvasBoxSize(canvas, sidePx) {
  const side = Math.max(0, Math.round(sidePx)) + 'px';
  canvas.style.width = side;
  canvas.style.height = side;
}

// resizeに加え、モバイルでアドレスバーの表示/非表示によってビューポートの
// 実効サイズが変わった場合にも追従できるよう、visualViewportのresizeも監視する。
window.addEventListener('resize', () => {
  if (frames && frames.length > 0) {
    applyLayoutMode();
  }
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    if (frames && frames.length > 0) {
      applyLayoutMode();
    }
  });
}

/**
 * 2枚同時表示モードで index と組み合わせて表示するフレーム番号を返す。
 * 基本は index+1(奇数番目・偶数番目のペア)。
 * 総フレーム数が奇数で、最終フレームにその規則での相方がいない場合は、
 * 直前のフレーム(index-1)と組み合わせる(先頭フレームの固定表示に
 * 偏らせず、直近のフレームと並べることで表示上の違和感を減らす)。
 */
function getPairedIndex(index) {
  if (index + 1 < frames.length) {
    return index + 1;
  }
  if (index - 1 >= 0) {
    return index - 1;
  }
  return 0; // フレームが1枚しかない場合
}

function showFrame(index, updateSlider) {
  if (!frames || frames.length === 0) {
    return;
  }

  renderFrameToCanvas(frames[index], qrCanvas1);

  if (dualModeCheckbox.checked) {
    qrSlot2.classList.remove('hidden');
    const secondIndex = getPairedIndex(index);
    renderFrameToCanvas(frames[secondIndex], qrCanvas2);
  }

  if (updateSlider) {
    suppressSliderEvent = true;
    frameSlider.value = String(Math.min(index, parseInt(frameSlider.max, 10)));
    suppressSliderEvent = false;
  }

  let rangeText;
  if (dualModeCheckbox.checked) {
    const secondIndex = getPairedIndex(index);
    rangeText = (index + 1) + '+' + (secondIndex + 1);
  } else {
    rangeText = String(index + 1);
  }

  trackBarLabel.textContent = '表示フレーム: ' + rangeText + ' / ' + frames.length +
      '(スライダーで任意のフレームへジャンプできます)';

  log('フレーム ' + rangeText + ' / ' + frames.length + ' を表示中' +
      (running ? '(自動送信中)' : '(手動表示中)') +
      (dualModeCheckbox.checked ? ' [2枚同時表示]' : ''));
}

function renderFrameToCanvas(payload, canvas) {
  const binaryString = bytesToBinaryString(payload);

  // typeNumber=0(自動判定)、誤り訂正レベルL固定
  const qr = qrcode(0, 'L');
  qr.addData(binaryString, 'Byte');
  qr.make();

  renderQrToCanvas(qr, canvas);
}

function renderQrToCanvas(qr, canvas) {
  const moduleCount = qr.getModuleCount();
  const cellPixels = 8;
  const quietZoneModules = 4; // QRコード規格上の推奨最小値
  const size = (moduleCount + quietZoneModules * 2) * cellPixels;

  // サイズが変わらない場合、width/heightへの再代入自体を避ける
  // (canvasのwidth/height代入は内容を強制クリアする副作用があり、
  //  値が同じでも毎回代入するとちらつきや余計な再描画コストにつながるため)
  if (canvas.width !== size || canvas.height !== size) {
    canvas.width = size;
    canvas.height = size;
  }

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000000';

  const offset = quietZoneModules * cellPixels;

  for (let row = 0; row < moduleCount; row++) {
    for (let col = 0; col < moduleCount; col++) {
      if (qr.isDark(row, col)) {
        ctx.fillRect(offset + col * cellPixels, offset + row * cellPixels, cellPixels, cellPixels);
      }
    }
  }
}
</script>
